[project]
name = "tcr-open-data"
version = "0.1.0"
description = "Builds The Care Ratings open nursing-home data releases from CMS public files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "The Care Ratings" }]
dependencies = [
  "duckdb>=1.1",
  "boto3>=1.34",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tcr-open-data = "tcr_open_data.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
