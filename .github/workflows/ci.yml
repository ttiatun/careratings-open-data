name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e . pytest
      - run: pytest -q
      - name: Codebook is up to date
        run: |
          python -m tcr_open_data.cli codebook --out /tmp/codebook.md
          diff -u docs/codebook.md /tmp/codebook.md
